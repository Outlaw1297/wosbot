name: CI — Java Build and Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: "-B --no-transfer-progress -Dstyle.color=never"

jobs:
  test:
    name: Build and test on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Stable baseline verification needs reachable vX.Y.Z tags.
          fetch-tags: true
          # Binaries are ordinary blobs; do not fetch Git LFS.
          lfs: false

      - name: Verify shipped binaries are real files
        run: build-support/verification/check_lfs_assets.sh

      - name: Fetch Stable and Nightly release tags
        run: |
          # Some PR runners advertise no tag refs from origin even when the
          # fork has them. Pull the public upstream tags whose commit SHAs are
          # already in history, then fall back to the fork remote.
          git fetch --force --tags https://github.com/Shederator/wosbot.git \
            'refs/tags/v*:refs/tags/v*' || true
          git fetch --force --tags origin 'refs/tags/v*:refs/tags/v*' || true
          echo "Local v* tags after fetch:"
          git tag --list 'v*'
          if ! git tag --list 'v*' | grep -q .; then
            echo "::error::No v* tags available after upstream/origin fetch"
            git ls-remote --tags origin 'v*' || true
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test build and release tooling
        run: |
          python3 build-support/release/verify_development_version.py
          python3 -m unittest discover -s build-support/verification -p "test_*.py"
          python3 -m unittest discover -s build-support/release -p "test_*.py"
          python3 -m unittest discover -s build-support/notifications -p "test_*.py"
          python3 build-support/verification/check_workflow_python.py

      # Saved-frame OCR tests bind the host Tesseract libraries through tess4j.
      # JavaFX controller tests need a virtual display on the headless runner.
      - name: Install Linux test runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr libtesseract-dev libleptonica-dev xvfb

      - name: Build and test Maven reactor
        run: |
          read -r -a maven_args <<< "${MAVEN_ARGS}"
          xvfb-run --auto-servernum ./mvnw "${maven_args[@]}" package

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-surefire-reports
          path: "**/target/surefire-reports/*.xml"
          if-no-files-found: ignore
          retention-days: 7
